<script>
    // ... (ส่วน UI และ CSS คงเดิมนะจ๊ะบอส) ...

    async function processAudit() {
        document.getElementById('ai-brain-process').style.display = 'block';
        addLog("เริ่มระบบ S-Audit Visual Logic (สสนช. Standard)...");
        
        let score7 = 0;
        let dst = studentImg.clone();
        
        // เตรียมภาพสำหรับตรวจความเข้ม
        let gray = new cv.Mat();
        cv.cvtColor(studentImg, gray, cv.COLOR_RGBA2GRAY);
        cv.threshold(gray, gray, 160, 255, cv.THRESH_BINARY_INV);

        [span_5](start_span)// วนลูปตรวจข้อ 1-7 เรียงจากบนลงล่าง[span_5](end_span)
        for (let i = 1; i <= 7; i++) {
            let y = 300 + (i * 62); // พิกัดแนวตั้ง
            let choices = [180, 240, 300, 360]; // พิกัด ก, ข, ค, ง (สมมติ)
            let studentChoice = -1;
            let maxIntensity = 0;

            // สแกนหาข้อที่นิสิตฝนเข้มที่สุด
            for (let c = 0; c < 4; c++) {
                let rect = new cv.Rect(choices[c] - 15, y - 15, 30, 30);
                let roi = gray.roi(rect);
                let intensity = (cv.countNonZero(roi) / 900) * 100;
                if (intensity > maxIntensity && intensity > 35) {
                    maxIntensity = intensity;
                    studentChoice = c;
                }
                roi.delete();
            }

            [span_6](start_span)[span_7](start_span)[span_8](start_span)// สมมติเฉลยจากไฟล์ AIPA[span_6](end_span)[span_7](end_span)[span_8](end_span)
            let answerKey = [2, 1, 3, 0, 2, 1, 1]; // เฉลยจำลอง
            let correctIdx = answerKey[i-1];

            addLog(`ข้อ ${i}: นิสิตตอบ ${studentChoice === -1 ? "ว่าง" : String.fromCharCode(3585 + studentChoice)}`);

            // --- ส่วนที่บอสสั่ง: วาดรูปเช็คถูก/กากบาท ---
            if (studentChoice === correctIdx) {
                // ตอบถูก: วาดเช็คถูกสีทอง (✓)
                drawCheckmark(dst, choices[studentChoice], y, [255, 215, 0, 255]); 
                score7++;
            } else {
                // ตอบผิด: วาดกากบาทสีแดง (✗) ตรงที่นิสิตตอบ
                if (studentChoice !== -1) {
                    drawCross(dst, choices[studentChoice], y, [255, 71, 87, 255]);
                }
                // และวาดเช็คถูกสีแดง (✓) ตรงเฉลยที่ถูกต้องตามสั่งจ่ะ!
                drawCheckmark(dst, choices[correctIdx], y, [255, 0, 0, 255]);
            }
        }
        
        // ... (ส่วนตรวจข้อ 8 อัตนัย และแสดงผล ScoreCard เหมือนเดิมจ่ะบอส) ...
        cv.imshow('outputCanvas', dst);
        dst.delete(); gray.delete();
    }

    // ฟังก์ชันวาดเช็คถูก (✓)
    function drawCheckmark(img, x, y, color) {
        cv.line(img, new cv.Point(x - 10, y), new cv.Point(x - 3, y + 10), color, 4);
        cv.line(img, new cv.Point(x - 3, y + 10), new cv.Point(x + 12, y - 12), color, 4);
    }

    // ฟังก์ชันวาดกากบาท (✗)
    function drawCross(img, x, y, color) {
        cv.line(img, new cv.Point(x - 10, y - 10), new cv.Point(x + 10, y + 10), color, 4);
        cv.line(img, new cv.Point(x + 10, y - 10), new cv.Point(x - 10, y + 10), color, 4);
    }
</script>
