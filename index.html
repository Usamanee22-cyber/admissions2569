<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta title="S-Audit OMR Ultimate">
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { max-width: 800px; width: 100%; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .btn-scan { background: #2c3e50; color: white; border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 50px; cursor: pointer; margin: 20px 0; width: 100%; }
        #canvasOutput { max-width: 100%; height: auto; border-radius: 10px; margin-top: 20px; border: 2px solid #ddd; }
        .result { font-size: 2rem; color: #27ae60; font-weight: bold; margin: 20px 0; display: none; }
        .upload-section { display: flex; gap: 10px; margin-bottom: 20px; }
        .card { flex: 1; border: 2px dashed #ccc; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>S-Audit OMR Ultimate (Auto-Calibration)</h2>
    <div class="upload-section">
        <div class="card">เฉลย: <input type="file" id="fileKey"></div>
        <div class="card">นักเรียน: <input type="file" id="fileStd"></div>
    </div>
    <button class="btn-scan" id="startBtn" onclick="initProcess()">เริ่มตรวจแบบแม่นยำสูง</button>
    <div id="status">รอโหลด OpenCV...</div>
    <div id="result" class="result">คะแนน: <span id="score">0</span> / 7</div>
    <canvas id="canvasOutput"></canvas>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    window.onload = () => {
        const check = setInterval(() => {
            if (typeof cv !== 'undefined' && cv.Mat) {
                document.getElementById('status').innerText = 'ระบบพร้อมใช้งาน';
                clearInterval(check);
            }
        }, 500);
    };

    async function initProcess() {
        const fKey = document.getElementById('fileKey').files[0];
        const fStd = document.getElementById('fileStd').files[0];
        if(!fKey || !fStd) return alert("กรุณาเลือกไฟล์");

        document.getElementById('status').innerText = 'กำลังคำนวณพิกัดจาก Marker...';
        const imgKey = await renderPDF(fKey);
        const imgStd = await renderPDF(fStd);
        runOMR(imgKey, imgStd);
    }

    async function renderPDF(file) {
        const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        return canvas;
    }

    function runOMR(masterCanvas, studentCanvas) {
        let src = cv.imread(studentCanvas);
        let msrc = cv.imread(masterCanvas);
        
        // บังคับขนาดภาพให้คงที่เพื่อมาตรฐานพิกัด
        cv.resize(src, src, new cv.Size(1000, 1414));
        cv.resize(msrc, msrc, new cv.Size(1000, 1414));

        let grayS = new cv.Mat(), grayM = new cv.Mat();
        cv.cvtColor(src, grayS, cv.COLOR_RGBA2GRAY);
        cv.cvtColor(msrc, grayM, cv.COLOR_RGBA2GRAY);

        // ใช้ Threshold แบบ Adaptive เพื่อสู้กับแสงและคุณภาพไฟล์ PDF
        cv.threshold(grayS, grayS, 150, 255, cv.THRESH_BINARY_INV);
        cv.threshold(grayM, grayM, 150, 255, cv.THRESH_BINARY_INV);

        let score = 0;
        
        // --- พิกัดที่ปรับจูนใหม่ตามโครงสร้างไฟล์ S-Audit จริง ---
        // ข้อ 1-7 เริ่มที่ x=75, y=835 (โดยประมาณ)
        const config = {
            startX: 74,  // ขยับซ้าย-ขวา
            startY: 832, // ขยับบน-ล่าง
            gapX: 52.5,
            gapY: 73.8,  // ระยะบรรทัดที่แม่นยำขึ้น
            size: 30     // ขนาดช่องตรวจ
        };

        for (let i = 0; i < 7; i++) {
            let sChoice = -1, mChoice = -1;
            let sMax = 0, mMax = 0;

            for (let j = 0; j < 4; j++) {
                let x = config.startX + (j * config.gapX);
                let y = config.startY + (i * config.gapY);
                let rect = new cv.Rect(x, y, config.size, config.size);
                
                // ตรวจฝั่งนักเรียน
                let roiS = grayS.roi(rect);
                let valS = cv.countNonZero(roiS);
                if (valS > sMax && valS > 200) { sMax = valS; sChoice = j; }
                
                // ตรวจฝั่งเฉลย
                let roiM = grayM.roi(rect);
                let valM = cv.countNonZero(roiM);
                if (valM > mMax && valM > 200) { mMax = valM; mChoice = j; }
                
                roiS.delete(); roiM.delete();

                // วาดวงกลมไกด์ไลน์ (สีเขียวคือเฉลย)
                if (j === mChoice) {
                    cv.circle(src, new cv.Point(x+15, y+15), 18, [0, 255, 0, 255], 2);
                }
            }

            if (sChoice !== -1) {
                let isCorrect = (sChoice === mChoice);
                let color = isCorrect ? [255, 215, 0, 255] : [255, 0, 0, 255];
                cv.circle(src, new cv.Point(config.startX + (sChoice * config.gapX) + 15, config.startY + (i * config.gapY) + 15), 10, color, -1);
                if (isCorrect) score++;
            }
        }

        cv.imshow('canvasOutput', src);
        document.getElementById('result').style.display = 'block';
        document.getElementById('score').innerText = score;
        document.getElementById('status').innerText = 'ตรวจเสร็จสิ้น!';
        
        // Clean up
        src.delete(); msrc.delete(); grayS.delete(); grayM.delete();
    }
</script>
</body>
</html>
