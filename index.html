<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>S-Audit Intelligence v2.7 | สสนช. Official System</title>
    <script async src="https://docs.opencv.org/4.5.0/opencv.js" type="text/javascript"></script>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-purple: #4B0082; --main-gold: #FFD700; --bg-gray: #f4f4f9; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg-gray); text-align: center; padding: 20px; color: #333; }
        .container { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(75,0,130,0.2); max-width: 1000px; margin: auto; border: 4px solid var(--main-gold); }
        h1 { color: var(--main-purple); font-size: 32px; border-bottom: 3px solid var(--main-gold); padding-bottom: 15px; display: inline-block; }
        .upload-section { display: flex; justify-content: space-between; margin: 30px 0; }
        .box { border: 2px dashed var(--main-purple); padding: 25px; border-radius: 15px; width: 45%; background: #fafafa; transition: 0.3s; }
        .box:hover { background: #f0e6ff; }
        .status-dot { width: 15px; height: 15px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .ready { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; } 
        .not-ready { background: #e74c3c; }
        button { background: var(--main-purple); color: var(--main-gold); border: 2px solid var(--main-gold); padding: 18px 40px; border-radius: 50px; cursor: pointer; font-size: 20px; font-weight: bold; margin-top: 20px; transition: 0.4s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        button:hover { transform: scale(1.05); background: #32005a; box-shadow: 0 8px 20px rgba(75,0,130,0.4); }
        #countdown { font-size: 80px; color: var(--main-purple); font-weight: bold; display: none; margin: 20px; text-shadow: 2px 2px var(--main-gold); }
        #ai-brain-process { display: none; background: #222; color: #00ff00; padding: 20px; border-radius: 10px; text-align: left; font-family: 'Courier New', monospace; margin-top: 20px; border-left: 10px solid var(--main-gold); overflow-y: auto; max-height: 300px; }
        .process-step { margin-bottom: 10px; border-bottom: 1px dashed #444; padding-bottom: 5px; }
        canvas { max-width: 100%; border: 3px solid var(--main-purple); margin-top: 20px; border-radius: 15px; display: none; }
        .score-card { background: linear-gradient(135deg, var(--main-purple), #32005a); color: white; padding: 30px; border-radius: 20px; margin-top: 20px; border: 3px solid var(--main-gold); display: none; }
        .ocr-debug-img { border: 2px solid var(--main-gold); margin: 10px; background: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 S-Audit Intelligence v2.7 | สสนช.</h1>
    <p>ระบบประมวลผลอัจฉริยภาพเชิงสัญลักษณ์และตรรกะศาสตร์ขั้นสูง</p>

    <div class="upload-section">
        <div class="box">
            <strong>📑 เฉลยมาตรฐาน (Template)</strong><br><br>
            <input type="file" id="templateInput" accept="image/*">
            <div id="tStatus"><span class="status-dot not-ready"></span>รอยืนยันไฟล์จ่ะ</div>
        </div>
        <div class="box">
            <strong>✍️ กระดาษนิสิต (Student Data)</strong><br><br>
            <input type="file" id="studentInput" accept="image/*">
            <div id="sStatus"><span class="status-dot not-ready"></span>รอยืนยันไฟล์จ่ะ</div>
        </div>
    </div>

    <button id="startBtn" onclick="startProcessing()">เริ่มการ Auditing ระดับมหาเทพ</button>
    <div id="countdown">3</div>

    <div id="ai-brain-process">
        <div style="color: var(--main-gold); font-weight: bold; margin-bottom: 10px;">🧠 AI THINKING PROCESS (LOG):</div>
        <div id="log-content"></div>
    </div>

    <div id="result-area">
        <div id="scoreDisplay" class="score-card"></div>
        <canvas id="outputCanvas"></canvas>
        <div id="ocr-debug-area" style="margin-top:20px; display:none;">
            <p style="font-weight:bold;">🖼️ ชิ้นส่วนที่ AI ตัดมาวิเคราะห์ลายมือ (ข้อ 8):</p>
            <canvas id="debugCropCanvas" class="ocr-debug-img"></canvas>
        </div>
    </div>
</div>

<script>
    let templateImg = null, studentImg = null;
    const logContent = document.getElementById('log-content');

    function addLog(msg) {
        const div = document.createElement('div');
        div.className = 'process-step';
        div.innerHTML = `> ${msg}`;
        logContent.appendChild(div);
        logContent.scrollTop = logContent.scrollHeight;
    }

    document.getElementById('templateInput').onchange = (e) => loadImg(e, 'template');
    document.getElementById('studentInput').onchange = (e) => loadImg(e, 'student');

    function loadImg(e, type) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                if(type === 'template') {
                    templateImg = cv.imread(img);
                    document.getElementById('tStatus').innerHTML = '<span class="status-dot ready"></span>ยืนยันเฉลยแล้ว';
                } else {
                    studentImg = cv.imread(img);
                    document.getElementById('sStatus').innerHTML = '<span class="status-dot ready"></span>ยืนยันข้อมูลนิสิตแล้ว';
                }
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    function startProcessing() {
        if (!templateImg || !studentImg) { alert("บอสขาาา ตรวจสอบไฟล์ให้ครบก่อนนะจ๊ะ! 💅"); return; }
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('countdown').style.display = 'block';
        let count = 3;
        const timer = setInterval(() => {
            count--; document.getElementById('countdown').innerText = count;
            if (count === 0) { clearInterval(timer); document.getElementById('countdown').style.display = 'none'; processAudit(); }
        }, 1000);
    }

    async function processAudit() {
        document.getElementById('ai-brain-process').style.display = 'block';
        addLog("เริ่มระบบ S-Audit Symbology Recognition (v2.7)...");
        
        let score7 = 0;
        let dst = studentImg.clone();
        
        let gray = new cv.Mat();
        let edges = new cv.Mat();
        cv.cvtColor(studentImg, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
        cv.Canny(gray, edges, 75, 200);

        // ตรวจข้อ 1-7 ตามแนว บน-ลงล่าง
        for (let i = 1; i <= 7; i++) {
            let y = 300 + (i * 62); 
            let x = 120; 
            
            let rect = new cv.Rect(x - 25, y - 25, 50, 50);
            let roi = edges.roi(rect);
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            
            cv.findContours(roi, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let symbolType = "none";
            if (contours.size() > 0) {
                let cnt = contours.get(0);
                let peri = cv.arcLength(cnt, true);
                let approx = new cv.Mat();
                cv.approxPolyDP(cnt, approx, 0.04 * peri, true);
                
                if (approx.rows === 2 || approx.rows === 3) symbolType = "check";
                else if (approx.rows >= 4) symbolType = "cross";
                
                approx.delete();
            }

            let color;
            if (symbolType === "check") {
                addLog(`ข้อที่ ${i}: ตรวจพบเครื่องหมายถูก [✓] - เกณฑ์จริยธรรมผ่าน!`);
                color = new cv.Scalar(255, 215, 0, 255); 
                score7++;
            } else if (symbolType === "cross") {
                addLog(`ข้อที่ ${i}: ตรวจพบเครื่องหมายกากบาท [X] - ไม่ผ่านเกณฑ์!`);
                color = new cv.Scalar(255, 71, 87, 255); 
            } else {
                color = new cv.Scalar(200, 200, 200, 255);
            }

            cv.rectangle(dst, new cv.Point(x-20, y-20), new cv.Point(x+20, y+20), color, 3);
            roi.delete(); contours.delete(); hierarchy.delete();
        }

        // 2. ตรวจข้อ 8 (อัตนัย)
        addLog("วิเคราะห์โซนอัตนัย: '8.ตอบ:'...");
        try {
            let ocrRoi = new cv.Rect(100, 850, 600, 120); 
            let cropped = studentImg.roi(ocrRoi);
            document.getElementById('ocr-debug-area').style.display = 'block';
            cv.imshow('debugCropCanvas', cropped);
            
            const result = await Tesseract.recognize(document.getElementById('debugCropCanvas'), 'tha+eng');
            let text = result.data.text.trim();
            addLog(`ข้อมูลลายมือที่ตรวจพบ: "${text}"`);
            
            if (text.includes("ควอนตัม") || text.includes("สังเกต") || text.includes("จริยธรรม")) {
                addLog("พบ Keyword ระดับ Superintelligence! +1 คะแนนพิเศษ");
                score7 += 1;
            }
            cropped.delete();
        } catch (e) { addLog("Error: AI ไม่สามารถถอดรหัสข้อ 8 ได้!"); }

        // 3. สรุปผล Pass/Fail 75%
        document.getElementById('outputCanvas').style.display = 'inline-block';
        cv.imshow('outputCanvas', dst);
        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.style.display = 'block';
        let totalPercent = (score7 / 8) * 100;
        
        scoreDisplay.innerHTML = `
            <h2 style="color: var(--main-gold);">👑 S-Audit Intelligence Report</h2>
            <hr style="border: 1px solid var(--main-gold);">
            <p>คะแนนความถูกต้องแม่นยำ: ${score7} / 8</p>
            <p style="font-size: 24px;"><b>คิดเป็น: ${totalPercent.toFixed(2)}%</b></p>
            <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-top: 10px;">
                <b>สรุปผล:</b> ${totalPercent >= 75 ? 'ผ่านเกณฑ์มาตรฐาน สสนช. ✅' : 'ตกเกณฑ์มาตรฐาน (ต้องอบรมใหม่) ❌'}
            </div>
        `;
        
        gray.delete(); edges.delete(); dst.delete();
    }
</script>

</body>
</html>
