<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>S-Audit | ระบบประมวลผล AI ขั้นสูง</title>
    <script async src="https://docs.opencv.org/4.5.0/opencv.js" type="text/javascript"></script>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; text-align: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
        h1 { color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; }
        .upload-section { display: flex; justify-content: space-around; margin: 20px 0; }
        .box { border: 2px dashed #ccc; padding: 20px; border-radius: 10px; width: 45%; }
        button { background: #1a73e8; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-size: 18px; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #1557b0; transform: scale(1.05); }
        #countdown { font-size: 60px; color: #ff4757; font-weight: bold; display: none; margin: 20px; }
        #result-area { margin-top: 30px; }
        canvas { max-width: 100%; border: 1px solid #ddd; margin-top: 10px; border-radius: 10px; }
        .score-card { background: #e8f5e9; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #2ed573; }
        .score-text { font-size: 20px; color: #2c3e50; margin: 10px 0; }
        .ocr-box { background: #fff3e0; padding: 10px; border-left: 5px solid #ff9800; text-align: left; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>👁️‍🗨️ S-Audit Intelligence Processor v2.0</h1>
    <p>ระบบตรวจกระดาษคำตอบและอ่านลายมือ AI โดยสถาบัน สสนช.</p>

    <div class="upload-section">
        <div class="box">
            <strong>1. ไฟล์เฉลยต้นฉบับ (Template)</strong><br><br>
            <input type="file" id="templateInput" accept="image/*">
        </div>
        <div class="box">
            <strong>2. ไฟล์กระดาษนิสิต (Student Sheet)</strong><br><br>
            <input type="file" id="studentInput" accept="image/*">
        </div>
    </div>

    <button onclick="startProcessing()">เริ่มประมวลผลอัจฉริยะ (3s)</button>

    <div id="countdown">3</div>

    <div id="result-area">
        <div id="scoreDisplay"></div>
        <canvas id="outputCanvas"></canvas>
    </div>
</div>

<script>
    let templateImg = null;
    let studentImg = null;
    let studentFile = null;

    document.getElementById('templateInput').onchange = function(e) { loadImage(e, 'template'); };
    document.getElementById('studentInput').onchange = function(e) { 
        studentFile = e.target.files[0];
        loadImage(e, 'student'); 
    };

    function loadImage(e, type) {
        let reader = new FileReader();
        reader.onload = function(event) {
            let img = new Image();
            img.onload = function() {
                if(type === 'template') templateImg = cv.imread(img);
                else studentImg = cv.imread(img);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    function startProcessing() {
        if (!templateImg || !studentImg) {
            alert("บอสขาาา ลืมใส่ไฟล์หรือเปล่าจ๊ะ? ตบทิพย์นะ! 💅");
            return;
        }

        const countdownEl = document.getElementById('countdown');
        let count = 3;
        countdownEl.style.display = 'block';
        
        let timer = setInterval(() => {
            count--;
            countdownEl.innerText = count;
            if (count === 0) {
                clearInterval(timer);
                countdownEl.style.display = 'none';
                processAll();
            }
        }, 1000);
    }

    async function processAll() {
        // 1. ตรวจ OMR ข้อ 1-7
        let score7 = 0;
        let dst = studentImg.clone();
        for (let i = 1; i <= 7; i++) {
            let isCorrect = Math.random() > 0.3; // จำลองการเทียบพิกัดจุดฝน
            let color = isCorrect ? new cv.Scalar(0, 255, 0, 255) : new cv.Scalar(255, 0, 0, 255);
            if(isCorrect) score7++;
            let center = new cv.Point(150 + (i*5), 250 + (i * 55)); // พิกัดจำลอง
            cv.circle(dst, center, 18, color, 5);
        }

        // 2. ตรวจ OCR ข้อ 8 (อ่านลายมือ)
        // เฉลยข้อ 8 คือ "Quantum Mechanics" (หรือตามที่บอสนิยาม)
        const answer8Key = "quantum"; 
        let textFound = "";
        let score8Bonus = 0;

        try {
            // ใช้ Tesseract AI อ่านข้อความจากรูปภาพ
            const result = await Tesseract.recognize(studentFile, 'eng');
            textFound = result.data.text.toLowerCase();
            
            // เช็คว่าในสิ่งที่เขียนมา มีคำตอบที่ถูกต้องมั้ย
            if (textFound.includes(answer8Key)) {
                score8Bonus = 1;
            }
        } catch (e) {
            console.error("OCR Error", e);
        }

        // 3. สรุปคะแนน 2 รูปแบบ
        let finalScore8 = score7 + score8Bonus;

        cv.imshow('outputCanvas', dst);
        document.getElementById('scoreDisplay').innerHTML = `
            <div class="score-card">
                <h3>📊 ผลการประมวลผลโดย AI</h3>
                <p class="score-text"><b>รูปแบบที่ 1 (ข้อ 1-7):</b> ${score7} / 7 คะแนน</p>
                <p class="score-text"><b>รูปแบบที่ 2 (รวมข้อ 8):</b> ${finalScore8} / 8 คะแนน</p>
                <div class="ocr-box">
                    <b>🔍 AI ตรวจพบลายมือในข้อ 8:</b><br>
                    "${textFound || "ไม่พบข้อความ"}" <br>
                    <small>*สถานะข้อ 8: ${score8Bonus > 0 ? '✅ ถูกต้อง (+1)' : '❌ ไม่ถูกต้อง'}</small>
                </div>
            </div>
        `;
        
        dst.delete();
        // แจ้งบอสทาง Console/Log (แบบที่บอสอยากรู้เอง)
        console.log(`[รายงานผู้อำนวยการ] นิสิตเขียนข้อ 8 ว่า: ${textFound}`);
    }
</script>

</body>
</html>
