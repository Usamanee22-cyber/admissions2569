<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Audit OMR Scanner</title>
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f0f2f5; text-align: center; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .upload-section { display: flex; justify-content: space-around; margin-bottom: 20px; border: 2px dashed #ccc; padding: 20px; }
        .btn-scan { background: #2c3e50; color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-scan:disabled { background: #95a5a6; }
        #status { margin: 15px; font-weight: bold; color: #e67e22; }
        #canvasOutput { max-width: 100%; margin-top: 20px; border: 1px solid #ddd; }
        .result-box { font-size: 24px; color: #27ae60; margin: 20px; display: none; }
        h2 { color: #2c3e50; }
        .legend { display: flex; justify-content: center; gap: 20px; font-size: 14px; margin-top: 10px; }
        .dot { height: 12px; width: 12px; border-radius: 2px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบตรวจข้อสอบ S-Audit OMR</h2>
    <p>รองรับไฟล์รูปภาพ (JPG/PNG) เพื่อการประมวลผลผ่าน Browser</p>

    <div class="upload-section">
        <div>
            <label>1. ไฟล์เฉลย (Master Key):</label><br>
            <input type="file" id="fileKey" accept="image/*">
        </div>
        <div>
            <label>2. ไฟล์กระดาษนิสิต:</label><br>
            <input type="file" id="fileStudent" accept="image/*">
        </div>
    </div>

    <button class="btn-scan" id="startBtn" onclick="processOMR()">เริ่มตรวจข้อสอบ</button>
    
    <div id="status"></div>
    <div id="result" class="result-box">คะแนนที่ได้: <span id="scoreText">0</span> / 7</div>

    <div class="legend" id="legend" style="display:none;">
        <span><span class="dot" style="background:blue;"></span> สแกนพบ (Student)</span>
        <span><span class="dot" style="background:green;"></span> เฉลย (Master)</span>
        <span><span class="dot" style="background:gold;"></span> ถูกต้อง</span>
    </div>

    <canvas id="canvasOutput"></canvas>
</div>

<script>
    let cvReady = false;
    window.onload = () => {
        document.getElementById('status').innerText = 'กำลังโหลด AI Library (OpenCV)...';
        setTimeout(() => {
            if(typeof cv !== 'undefined') {
                document.getElementById('status').innerText = 'ระบบพร้อมใช้งาน';
                cvReady = true;
            }
        }, 3000);
    };

    async function processOMR() {
        const fileKey = document.getElementById('fileKey').files[0];
        const fileStudent = document.getElementById('fileStudent').files[0];

        if (!fileKey || !fileStudent) {
            alert("กรุณาใส่ไฟล์ให้ครบทั้ง 2 ช่องครับ");
            return;
        }

        // Countdown 3 seconds
        let count = 3;
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        
        const timer = setInterval(() => {
            document.getElementById('status').innerText = `กำลังประมวลผลใน ${count}...`;
            count--;
            if (count < 0) {
                clearInterval(timer);
                analyzeImages(fileKey, fileStudent);
            }
        }, 1000);
    }

    async function analyzeImages(fileKey, fileStudent) {
        document.getElementById('status').innerText = 'กำลังคำนวณตำแหน่งและตรวจคำตอบ...';
        
        const masterImg = await loadImage(fileKey);
        const studentImg = await loadImage(fileStudent);

        // ในตัวอย่างนี้เราจะใช้รูปนิสิตเป็นพื้นหลังในการแสดงผล
        let src = cv.imread(studentImg);
        let masterSrc = cv.imread(masterImg);
        
        // ฟังก์ชันจำลองการหาตำแหน่ง (ในระบบจริงจะใช้สี่เหลี่ยม 4 มุมเป็น Anchor)
        // เพื่อให้โค้ดทำงานได้ทันที จะกำหนด Grid สัดส่วนพื้นที่โดยประมาณของข้อ 1-7
        const rows = 7;
        const cols = 4; // ก ข ค ง
        let score = 0;

        // วนลูปตรวจแต่ละข้อ
        for (let i = 0; i < rows; i++) {
            let studentChoice = detectChoice(src, i);
            let masterChoice = detectChoice(masterSrc, i);

            // วาดจุดสี (จำลองตำแหน่งบน Canvas)
            drawFeedback(src, i, studentChoice, masterChoice);

            if (studentChoice === masterChoice && studentChoice !== -1) {
                score++;
            }
        }

        cv.imshow('canvasOutput', src);
        document.getElementById('result').style.display = 'block';
        document.getElementById('legend').style.display = 'flex';
        document.getElementById('scoreText').innerText = score;
        document.getElementById('status').innerText = 'ตรวจเสร็จสิ้น!';
        btn.disabled = false;
        
        src.delete(); masterSrc.delete();
    }

    // ฟังก์ชันอ่านภาพ
    function loadImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // ฟังก์ชันตรวจหาว่านิสิตฝนข้อไหน (Logic: ตรวจสอบความเข้มของ Pixel)
    function detectChoice(mat, rowIdx) {
        // ในระบบจริงต้องคำนวณจากสี่เหลี่ยม 4 มุม 
        // นี่คือ Logic ตัวอย่างในการสุ่มตรวจความเข้ม (Simplified)
        let choices = [0, 1, 2, 3]; 
        // จำลองค่าที่ตรวจพบ (ควรเขียน Logic หา Gray scale และ Threshold ตรงนี้)
        return Math.floor(Math.random() * 4); 
    }

    function drawFeedback(img, row, sChoice, mChoice) {
        // คำนวณพิกัดจำลอง (ในงานจริงต้องดึงจากพิกัด ROI)
        let xBase = 100;
        let yBase = 200 + (row * 60);
        let radius = 15;

        for(let c = 0; c < 4; c++) {
            let center = new cv.Point(xBase + (c * 80), yBase);
            
            // 1. วงสีเขียว (เฉลย)
            if(c === mChoice) {
                cv.circle(img, center, radius + 5, [46, 204, 113, 255], 3);
            }
            // 2. วงสีน้ำเงิน (ที่นิสิตฝน)
            if(c === sChoice) {
                cv.circle(img, center, radius, [0, 0, 255, 255], -1);
            }
            // 3. วงสีทอง (ถ้าถูกต้อง)
            if(c === sChoice && sChoice === mChoice) {
                cv.circle(img, center, radius + 8, [212, 175, 55, 255], 4);
            }
        }
    }
</script>

</body>
</html>
