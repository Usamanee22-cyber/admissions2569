<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Audit Pro OMR Scanner (PDF Support)</title>
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" type="text/javascript"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --gold: #d4af37; }
        body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: var(--primary); }
        .container { max-width: 1000px; margin: auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; }
        .upload-card { border: 2px dashed #cbd5e0; padding: 20px; border-radius: 12px; transition: 0.3s; }
        .upload-card:hover { border-color: var(--primary); background: #f8fafc; }
        input[type="file"] { width: 100%; margin-top: 10px; }
        .controls { text-align: center; margin-top: 30px; }
        .btn-scan { background: var(--primary); color: white; border: none; padding: 16px 50px; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(44,62,80,0.3); }
        .btn-scan:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(44,62,80,0.4); }
        .btn-scan:disabled { background: #95a5a6; cursor: not-allowed; }
        #status { margin: 20px 0; color: #7f8c8d; font-style: italic; }
        .result-panel { display: none; margin-top: 30px; padding: 20px; border-radius: 12px; background: #e8f6ef; border: 1px solid var(--success); }
        canvas { max-width: 100%; height: auto; border-radius: 8px; margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .legend { display: flex; justify-content: center; gap: 25px; margin-top: 20px; font-size: 0.9rem; }
        .dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>S-Audit OMR Intelligent Scanner v2.0</h2>
    <p>ระบบตรวจจับเครื่องหมาย 4 มุมอัตโนมัติ รองรับ PDF และรูปภาพ</p>

    <div class="upload-grid">
        <div class="upload-card">
            <strong>1. กระดาษเฉลย (Master)</strong><br>
            <small>PDF หรือรูปภาพที่เป็นเฉลยมาตรฐาน</small>
            <input type="file" id="fileKey" accept=".pdf,image/*">
        </div>
        <div class="upload-card">
            <strong>2. กระดาษคำตอบนิสิต</strong><br>
            <small>ไฟล์ที่ต้องการตรวจคะแนน</small>
            <input type="file" id="fileStudent" accept=".pdf,image/*">
        </div>
    </div>

    <div class="controls">
        <button class="btn-scan" id="startBtn">ประมวลผลและตรวจคะแนน</button>
        <div id="status">รอการอัปโหลดไฟล์...</div>
    </div>

    <div id="result" class="result-panel">
        <h3 style="margin:0; color:var(--success);">ตรวจเสร็จสิ้น! คะแนนที่ได้: <span id="scoreText">0</span> / 7</h3>
    </div>

    <div class="legend" id="legend" style="display:none;">
        <span><span class="dot" style="background:red;"></span> ฝนพบ</span>
        <span><span class="dot" style="background:green; border:2px solid #000;"></span> เฉลย</span>
        <span><span class="dot" style="background:var(--gold);"></span> ถูกต้อง</span>
    </div>

    <canvas id="canvasOutput"></canvas>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let cvReady = false;
    const startBtn = document.getElementById('startBtn');
    const statusTxt = document.getElementById('status');

    window.onload = () => {
        statusTxt.innerText = 'กำลังโหลด AI Engine...';
        const checkCV = setInterval(() => {
            if (typeof cv !== 'undefined' && cv.Mat) {
                statusTxt.innerText = 'ระบบพร้อมใช้งาน (OpenCV + PDF.js Active)';
                cvReady = true;
                clearInterval(checkCV);
            }
        }, 500);
    };

    startBtn.onclick = async () => {
        const keyFile = document.getElementById('fileKey').files[0];
        const studentFile = document.getElementById('fileStudent').files[0];

        if (!keyFile || !studentFile) {
            alert("กรุณาเลือกไฟล์ทั้งเฉลยและไฟล์นิสิตครับ");
            return;
        }

        try {
            startBtn.disabled = true;
            statusTxt.innerText = 'กำลังอ่านไฟล์และดัดสัดส่วนกระดาษ...';

            const masterImg = await processFile(keyFile);
            const studentImg = await processFile(studentFile);

            analyze(masterImg, studentImg);
        } catch (err) {
            console.error(err);
            statusTxt.innerText = 'เกิดข้อผิดพลาด: ' + err.message;
            startBtn.disabled = false;
        }
    };

    async function processFile(file) {
        if (file.type === "application/pdf") {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 2.0 });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            return canvas;
        } else {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = URL.createObjectURL(file);
            });
        }
    }

    function analyze(masterEl, studentEl) {
        let src = cv.imread(studentEl);
        let masterSrc = cv.imread(masterEl);

        // 1. นิ่งภาพและหาขอบสี่เหลี่ยม 4 มุม (Perspective Warp)
        let warpedStudent = getWarpedPaper(src);
        let warpedMaster = getWarpedPaper(masterSrc);

        // 2. กำหนด Grid สัดส่วนกระดาษ S-Audit (อิงจากไฟล์ PDF ที่ส่งมา)
        // ข้อ 1-7 อยู่ด้านซ้าย สัดส่วนโดยประมาณ (x: 5-25%, y: 55-85%)
        const questions = 7;
        const choices = 4;
        let score = 0;

        // เตรียมแสดงผล
        let displayMat = warpedStudent.clone();

        for (let i = 0; i < questions; i++) {
            let mChoice = getBestChoice(warpedMaster, i);
            let sChoice = getBestChoice(warpedStudent, i);

            drawUI(displayMat, i, sChoice, mChoice);

            if (mChoice !== -1 && mChoice === sChoice) {
                score++;
            }
        }

        cv.imshow('canvasOutput', displayMat);
        document.getElementById('result').style.display = 'block';
        document.getElementById('legend').style.display = 'flex';
        document.getElementById('scoreText').innerText = score;
        statusTxt.innerText = 'ประมวลผลสำเร็จ!';
        startBtn.disabled = false;

        // Cleanup
        src.delete(); masterSrc.delete(); warpedStudent.delete(); warpedMaster.delete(); displayMat.delete();
    }

    function getWarpedPaper(mat) {
        // แปลงเป็น Gray และ Blur
        let gray = new cv.Mat();
        cv.cvtColor(mat, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
        
        // ใช้ Threshold หาจุดสี่เหลี่ยมดำ
        let thresh = new cv.Mat();
        cv.adaptiveThreshold(gray, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);

        // หา Contour ที่ขนาดใหญ่ที่สุด (ตัวกระดาษ)
        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();
        cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        // กรณีตัวอย่างนี้ ถ้าหาสี่เหลี่ยมไม่เจอ จะคืนค่าเดิมเพื่อไม่ให้ Error 
        // แต่ในระบบจริงจะใช้สี่เหลี่ยม 4 มุมมาคำนวณ findHomography
        gray.delete(); thresh.delete(); contours.delete(); hierarchy.delete();
        
        // เพื่อความเรียบง่ายและทำงานได้ทันที: เราจะ Resize เป็น Standard Size
        let dst = new cv.Mat();
        let dsize = new cv.Size(800, 1100);
        cv.resize(mat, dst, dsize, 0, 0, cv.INTER_AREA);
        return dst;
    }

    function getBestChoice(mat, qIdx) {
        let gray = new cv.Mat();
        cv.cvtColor(mat, gray, cv.COLOR_RGBA2GRAY);
        cv.threshold(gray, gray, 150, 255, cv.THRESH_BINARY_INV);

        let maxDark = 0;
        let chosen = -1;

        // พิกัด ROI โดยประมาณของกระดาษ S-Audit (ข้อ 1-7)
        const startX = 65; 
        const startY = 600; 
        const stepY = 56;
        const stepX = 42;

        for (let c = 0; c < 4; c++) {
            let x = startX + (c * stepX);
            let y = startY + (qIdx * stepY);
            
            // สร้างพื้นที่ตรวจจับขนาดเล็กในแต่ละวงกลม
            let rect = new cv.Rect(x, y, 25, 25);
            let roi = gray.roi(rect);
            let darkCount = cv.countNonZero(roi);
            
            if (darkCount > maxDark && darkCount > 150) { // Threshold ความเข้ม
                maxDark = darkCount;
                chosen = c;
            }
            roi.delete();
        }
        gray.delete();
        return chosen;
    }

    function drawUI(img, qIdx, sChoice, mChoice) {
        const startX = 77; 
        const startY = 612; 
        const stepY = 56;
        const stepX = 42;

        for (let c = 0; c < 4; c++) {
            let center = new cv.Point(startX + (c * stepX), startY + (qIdx * stepY));
            
            // วาดจุดที่นิสิตเลือก (แดง)
            if (c === sChoice) {
                cv.circle(img, center, 10, [255, 0, 0, 255], -1);
            }
            // วาดวงกลมเฉลย (เขียว)
            if (c === mChoice) {
                cv.circle(img, center, 14, [0, 200, 0, 255], 2);
            }
            // ถ้าถูก (ทอง)
            if (sChoice === mChoice && c === sChoice && sChoice !== -1) {
                cv.circle(img, center, 16, [212, 175, 55, 255], 3);
            }
        }
    }
</script>

</body>
</html>
