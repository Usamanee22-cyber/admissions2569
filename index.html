<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMR Answer Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .form-group {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="file"] {
            display: block;
        }

        .button-group {
            text-align: center;
            margin-top: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            font-size: 18px;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            display: none; /* Initially hidden */
        }

        #result-score {
            background-color: #28a745;
        }

        #result-images {
            margin-top: 30px;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
        }

        .legend {
            margin-top: 20px;
            text-align: center;
        }

        .legend div {
            display: inline-block;
            margin: 0 10px;
            padding: 5px 10px;
            font-size: 14px;
            color: #fff;
            border-radius: 5px;
        }

        .blue { background-color: blue; }
        .green { background-color: green; }
        .gold { background-color: goldenrod; }
    </style>
</head>
<body>
    <h1>OMR Answer Checker</h1>
    <div class="form-container">
        <form id="omrForm">
            <div class="form-group">
                <label for="answerKeyPDF">อัปโหลดไฟล์ PDF เฉลยข้อสอบ:</label>
                <input type="file" id="answerKeyPDF" accept="application/pdf" required>
            </div>
            <div class="form-group">
                <label for="studentAnswerPDF">อัปโหลดไฟล์ PDF ของนิสิต:</label>
                <input type="file" id="studentAnswerPDF" accept="application/pdf" required>
            </div>
            <div class="button-group">
                <button type="button" onclick="startProcessing()">เริ่มประมวลผล</button>
            </div>
        </form>
        <div class="result" id="result-score">คะแนนที่ได้รับ: <span id="score">0</span> /7</div>
        <div id="result-images">
            <h3>ผลลัพธ์:</h3>
            <div>
                <h4>ภาพกระดาษนิสิต:</h4>
                <img id="studentImage" alt="Student Paper">
            </div>
            <div class="legend">
                <div class="blue">ช่องฝนของนิสิต</div>
                <div class="green">ช่องเฉลย</div>
                <div class="gold">ช่องที่ถูกต้อง</div>
            </div>
        </div>
    </div>

    <script>
        function startProcessing() {
            const form = document.getElementById('omrForm');
            const answerKeyPDF = document.getElementById('answerKeyPDF');
            const studentAnswerPDF = document.getElementById('studentAnswerPDF');
            const resultScore = document.getElementById('result-score');
            const studentImage = document.getElementById('studentImage');
            const scoreElement = document.getElementById('score');

            // Validation for file inputs
            if (!answerKeyPDF.files.length || !studentAnswerPDF.files.length) {
                alert("กรุณาอัปโหลดไฟล์ PDF ทั้งคู่ก่อนเริ่มประมวลผล!");
                return;
            }

            // Countdown and initiate process simulation
            let countdown = 3;
            const interval = setInterval(() => {
                alert(`เริ่มกระบวนการในอีก ${countdown--} วินาที...`);
                if (countdown < 0) {
                    clearInterval(interval);
                    processOMR();
                }
            }, 1000);

            function processOMR() {
                // Simulating score processing
                const simulatedScore = Math.floor(Math.random() * 8);
                scoreElement.textContent = simulatedScore; // Display score dynamically
                resultScore.style.display = "block";
                studentImage.src = "student-paper.jpg"; // Display placeholder image
            }
        }
    </script>
</body>
</html>
